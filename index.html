<title>ちびかま！（仮）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=swap">
<style>
  :root {
    --bg: #120a0e;
    --cab: #1e1016;
    --cab-hi: #2b1821;
    --slot: #0a0507;
    --gold: #f0b429;
    --gold-dim: #8a6413;
    --neon: #ff3d7f;
    --mint: #37d6b0;
    --ink: #f8ede2;
    --dim: #a4898f;
    --line: #3c222c;
    --cell: 84px;
    --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
    --dot: "DotGothic16", "Hiragino Sans", "Yu Gothic", monospace;
  }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(120% 80% at 50% -10%, #2a1119 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px);
    color: var(--ink);
    font-family: var(--dot);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 14px 48px;
  }

  .cabinet {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---- 看板 ---- */
  .marquee {
    border: 3px solid var(--gold-dim);
    border-radius: 10px;
    background: linear-gradient(180deg, var(--cab-hi), var(--cab));
    padding: 18px 16px 14px;
    text-align: center;
    position: relative;
    box-shadow: 0 0 0 1px #000 inset, 0 14px 40px rgba(0,0,0,.6);
  }
  .bulbs {
    position: absolute;
    inset: 6px 8px auto 8px;
    display: flex;
    justify-content: space-between;
  }
  .bulbs.bottom { inset: auto 8px 6px 8px; }
  .bulb {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold-dim);
    animation: blink 1.1s steps(1) infinite;
  }
  .bulb:nth-child(odd) { animation-delay: .55s; }
  @keyframes blink {
    0%, 49% { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    50%, 100% { background: var(--gold-dim); box-shadow: none; }
  }
  h1 {
    font-family: var(--display);
    font-size: clamp(30px, 8vw, 52px);
    line-height: 1.1;
    margin: 6px 0 4px;
    color: var(--gold);
    text-wrap: balance;
    text-shadow: 0 0 18px rgba(240,180,41,.45), 3px 3px 0 #000;
  }
  .tagline {
    font-size: 12px;
    letter-spacing: .22em;
    color: var(--dim);
  }

  /* ---- スコア帯 ---- */
  .meters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .meter {
    background: var(--slot);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    text-align: center;
  }
  .meter dt {
    font-size: 10px;
    letter-spacing: .2em;
    color: var(--dim);
    margin: 0 0 3px;
  }
  .meter dd {
    margin: 0;
    font-family: var(--display);
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    color: var(--mint);
  }
  .meter dd.debt { color: var(--neon); }

  /* ---- リール ---- */
  .machine {
    border: 3px solid var(--gold-dim);
    border-radius: 10px;
    background: linear-gradient(180deg, var(--cab), #170c11);
    padding: 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,.6);
  }
  .reels {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: var(--slot);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    position: relative;
  }
  .payline {
    position: absolute;
    left: 4px; right: 4px;
    top: 50%;
    height: calc(var(--cell) + 6px);
    transform: translateY(-50%);
    border-top: 2px solid var(--neon);
    border-bottom: 2px solid var(--neon);
    pointer-events: none;
    box-shadow: 0 0 14px rgba(255,61,127,.35);
    z-index: 2;
  }
  .reel {
    height: calc(var(--cell) * 3);
    overflow: hidden;
    background: linear-gradient(180deg, #000 0%, #1a0f14 22%, #22141a 50%, #1a0f14 78%, #000 100%);
    border-radius: 4px;
    position: relative;
  }
  .strip { will-change: transform; }
  .sym {
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-size: clamp(22px, 6.4vw, 34px);
    color: var(--ink);
    text-shadow: 2px 2px 0 #000;
  }
  .reel.locked .sym { color: var(--gold); }

  /* ---- ボタン ---- */
  .stops {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  button {
    font-family: var(--dot);
    font-size: 14px;
    color: var(--ink);
    background: var(--cab-hi);
    border: 2px solid var(--line);
    border-bottom-width: 5px;
    border-radius: 8px;
    padding: 12px 6px;
    cursor: pointer;
    transition: transform .06s, background .15s;
  }
  button:hover:not(:disabled) { background: #3a2029; }
  button:active:not(:disabled) {
    transform: translateY(3px);
    border-bottom-width: 2px;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .stops button {
    color: var(--neon);
    border-color: #5a2038;
    background: #2b1019;
  }
  .stops button:hover:not(:disabled) { background: #401726; }
  .stops button .key {
    display: block;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: .1em;
  }

  .controls {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  #lever {
    color: #1a0d12;
    background: linear-gradient(180deg, var(--gold), #c98d10);
    border-color: #6b4c0c;
    font-size: 17px;
    letter-spacing: .12em;
  }
  #lever:hover:not(:disabled) { background: linear-gradient(180deg, #ffc94a, var(--gold)); }

  /* ---- テロップ ---- */
  .telop {
    min-height: 76px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-align: center;
    margin-top: 14px;
    padding: 8px;
  }
  .telop .hit {
    font-family: var(--display);
    font-size: clamp(20px, 5.5vw, 30px);
    color: var(--gold);
    text-shadow: 3px 3px 0 #000, 0 0 22px rgba(240,180,41,.5);
  }
  .telop .hit.miss { color: var(--dim); text-shadow: 2px 2px 0 #000; }
  .telop .hit.jackpot {
    color: var(--neon);
    text-shadow: 3px 3px 0 #000, 0 0 26px var(--neon);
    animation: shake .32s steps(2) 4;
  }
  .telop .sub { font-size: 13px; color: var(--dim); }
  @keyframes shake {
    0% { transform: translate(-3px, 1px) rotate(-1.5deg); }
    50% { transform: translate(3px, -2px) rotate(1.5deg); }
    100% { transform: translate(-3px, 1px) rotate(-1.5deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bulb { animation: none; background: var(--gold-dim); }
    .telop .hit.jackpot { animation: none; }
  }

  /* ---- 下段 ---- */
  .lower {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 14px;
  }
  @media (max-width: 620px) {
    .lower { grid-template-columns: 1fr; }
    :root { --cell: 66px; }
  }
  .panel {
    background: var(--cab);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 12px 13px;
  }
  .panel h2 {
    font-family: var(--dot);
    font-size: 11px;
    letter-spacing: .26em;
    color: var(--gold);
    margin: 0 0 9px;
    padding-bottom: 7px;
    border-bottom: 1px dashed var(--line);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 4px 0; vertical-align: baseline; }
  td.pat { color: var(--ink); white-space: nowrap; }
  td.nm { color: var(--dim); padding-left: 8px; }
  td.pt {
    text-align: right;
    color: var(--mint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  tr.top td.pat, tr.top td.pt { color: var(--neon); }
  td.od {
    text-align: right;
    padding-left: 10px;
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ev {
    margin: 10px 0 0;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    font-size: 11px;
    color: var(--dim);
  }
  #log {
    list-style: none;
    margin: 0; padding: 0;
    font-size: 12px;
    max-height: 210px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #log li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--dim);
    border-bottom: 1px dotted var(--line);
    padding-bottom: 4px;
  }
  #log li b { color: var(--ink); font-weight: normal; }
  #log li .p { color: var(--mint); font-variant-numeric: tabular-nums; }
  #log li.zero .p { color: var(--dim); }
  .empty { color: var(--dim); font-size: 12px; }
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .1em;
  }
</style>

<main class="cabinet">
  <header class="marquee">
    <div class="bulbs" aria-hidden="true"></div>
    <h1>ちびかま！（仮）</h1>
    <p class="tagline">4 リール 語 感 ス ロ ッ ト</p>
    <div class="bulbs bottom" aria-hidden="true"></div>
  </header>

  <dl class="meters">
    <div class="meter"><dt>SCORE</dt><dd id="m-score">0</dd></div>
    <div class="meter"><dt>連チャン</dt><dd id="m-streak">0</dd></div>
    <div class="meter"><dt>ベスト</dt><dd id="m-best">0</dd></div>
  </dl>

  <section class="machine">
    <div class="reels" id="reels">
      <div class="payline" aria-hidden="true"></div>
    </div>

    <div class="stops" id="stops"></div>

    <div class="controls">
      <button id="lever">レバーを叩く</button>
      <button id="auto">オート停止</button>
      <button id="mute">音 ON</button>
    </div>

    <div class="telop" id="telop" aria-live="polite">
      <div class="hit miss">レバーを叩け</div>
      <div class="sub">スペースで回して、スペース連打で左から止まる</div>
    </div>
  </section>

  <div class="lower">
    <section class="panel">
      <h2>配 当 表</h2>
      <table id="paytable"></table>
      <p class="ev" id="ev"></p>
    </section>
    <section class="panel">
      <h2>実 況 履 歴</h2>
      <ul id="log"><li class="empty">まだ何も起きてない。</li></ul>
    </section>
  </div>

  <footer>ちびかま！（仮） — 仮なので何も確定していない</footer>
</main>

<script>
(function () {
  "use strict";

  var REELS = 4;
  var PENALTY = 150; // ハズレたときに引かれる点

  // リールごとの絵柄並び。同じ絵柄を重ねたぶんだけ止まりやすい。
  // これで3役の出やすさに差が付く（ちびかま！が一番レア）。
  var STRIPS = [
    ["チン", "チン", "ビン", "カン", "マン"], // チンが濃い
    ["チン", "ビン", "カン", "カン", "マン"], // カンが濃い
    ["チン", "ビン", "カン", "カン", "マン"], // カンが濃い
    ["チン", "ビン", "カン", "マン", "マン"]  // マンが濃い
  ];

  // 役。この3つ以外は全部ハズレ。
  var HANDS = [
    { pat: "ビンビンチンチン", name: "ちびかま！", pts: 25000, top: true,
      test: function (r) { return r.join("") === "ビンビンチンチン"; },
      quip: "出た！！！これが見たかった！！！" },
    { pat: "ビンカンチンチン", name: "敏感", pts: 12000, top: true,
      test: function (r) { return r.join("") === "ビンカンチンチン"; },
      quip: "触んな。" },
    { pat: "チンビンカンマン", name: "完全体", pts: 3000, top: true,
      test: function (r) { return r.join("") === "チンビンカンマン"; },
      quip: "並び順まで完璧。もう帰っていい。" }
  ];

  var MISS = [
    "何も起きなかった。",
    "無。",
    "今のは無かったことに。",
    "全然ダメ。次いこ次。",
    "これが実力です。",
    "台がおかしい。"
  ];

  // ---- 音 ----
  var ctx = null, muted = false;
  function beep(freq, dur, type, gain) {
    if (muted) return;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain == null ? 0.06 : gain, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch (e) { /* 音が出なくてもゲームは続く */ }
  }
  function fanfare(notes, step) {
    notes.forEach(function (f, i) {
      setTimeout(function () { beep(f, 0.18, "square", 0.07); }, i * (step || 90));
    });
  }

  // ---- リール構築 ----
  var reelsEl = document.getElementById("reels");
  var stopsEl = document.getElementById("stops");
  var reels = [];

  for (var i = 0; i < REELS; i++) {
    var wrap = document.createElement("div");
    wrap.className = "reel";
    var strip = document.createElement("div");
    strip.className = "strip";
    var syms = STRIPS[i];
    for (var k = 0; k < syms.length * 3; k++) {
      var s = document.createElement("div");
      s.className = "sym";
      s.textContent = syms[k % syms.length];
      strip.appendChild(s);
    }
    wrap.appendChild(strip);
    reelsEl.appendChild(wrap);
    reels.push({ el: wrap, strip: strip, syms: syms, offset: 0, spinning: false, anim: null, speed: 0 });

    var b = document.createElement("button");
    b.innerHTML = "STOP <span class=\"key\">" + (i + 1) + "</span>";
    b.disabled = true;
    (function (idx) {
      b.addEventListener("click", function () { stopReel(idx); });
    })(i);
    stopsEl.appendChild(b);
    reels[i].btn = b;
  }

  document.querySelectorAll(".bulbs").forEach(function (row) {
    for (var n = 0; n < 14; n++) {
      var d = document.createElement("span");
      d.className = "bulb";
      row.appendChild(d);
    }
  });

  function cellH() {
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"));
  }
  function symbolAt(r, h) {
    var n = r.syms.length;
    return r.syms[(Math.floor(r.offset / h) + 1) % n];
  }
  function draw(r) {
    r.strip.style.transform = "translateY(" + (-r.offset) + "px)";
  }

  // ---- ゲーム状態 ----
  var score = 0, streak = 0, best = 0, spinning = false, autoTimers = [];
  var leverEl = document.getElementById("lever");
  var telopEl = document.getElementById("telop");
  var logEl = document.getElementById("log");

  try {
    var saved = localStorage.getItem("chibikama-best");
    if (saved) best = parseInt(saved, 10) || 0;
  } catch (e) { /* 保存が使えない環境でも遊べる */ }

  function render() {
    document.getElementById("m-score").textContent = score.toLocaleString("ja-JP");
    document.getElementById("m-score").classList.toggle("debt", score < 0);
    document.getElementById("m-streak").textContent = streak;
    document.getElementById("m-best").textContent = best.toLocaleString("ja-JP");
  }
  function telop(main, sub, cls) {
    telopEl.innerHTML = "";
    var a = document.createElement("div");
    a.className = "hit" + (cls ? " " + cls : "");
    a.textContent = main;
    var b = document.createElement("div");
    b.className = "sub";
    b.textContent = sub;
    telopEl.appendChild(a);
    telopEl.appendChild(b);
  }

  var last = 0;
  function tick(now) {
    var dt = last ? Math.min(now - last, 50) : 16;
    last = now;
    var h = cellH(), any = false;
    for (var i = 0; i < reels.length; i++) {
      var r = reels[i];
      var loop = h * r.syms.length;
      if (r.spinning) {
        r.offset = (r.offset + r.speed * dt) % loop;
        draw(r);
        any = true;
      } else if (r.anim) {
        var t = Math.min((now - r.anim.t0) / r.anim.dur, 1);
        var e = 1 - Math.pow(1 - t, 3);
        r.offset = r.anim.from + (r.anim.to - r.anim.from) * e;
        draw(r);
        if (t >= 1) {
          r.offset = ((r.anim.to % loop) + loop) % loop;
          draw(r);
          r.anim = null;
          r.el.classList.add("locked");
          beep(420 + i * 110, 0.09);
          if (reels.every(function (x) { return !x.spinning && !x.anim; })) judge();
        }
        any = true;
      }
    }
    if (any) requestAnimationFrame(tick);
    else last = 0;
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    clearAuto();
    var h = cellH();
    reels.forEach(function (r, i) {
      r.spinning = true;
      r.speed = (1.5 + i * 0.12) * h / 100;
      r.el.classList.remove("locked");
      r.btn.disabled = false;
    });
    leverEl.disabled = true;
    telop("回転中", "止めろ！（1〜4 / スペースで左から）");
    beep(200, 0.12, "sawtooth");
    last = 0;
    requestAnimationFrame(tick);
  }

  function stopReel(i) {
    var r = reels[i];
    if (!r.spinning) return;
    var n = r.syms.length;
    var h = cellH(), loop = h * n;
    var want = Math.floor(Math.random() * n);
    // 目標: (floor(offset/h)+1)%n === want かつ offset が h の倍数
    var k = ((want - 1) % n + n) % n;
    var from = r.offset;
    var to = Math.ceil(from / h) * h;
    while (((to / h) % n + n) % n !== k) to += h;
    to += loop; // 最低1周は余分に回す
    r.spinning = false;
    r.btn.disabled = true;
    r.anim = { t0: performance.now(), dur: 380, from: from, to: to };
    beep(300, 0.05, "triangle");
  }

  function clearAuto() {
    autoTimers.forEach(clearTimeout);
    autoTimers = [];
  }

  function judge() {
    var h = cellH();
    var res = reels.map(function (r) { return symbolAt(r, h); });
    var hand = null;
    for (var i = 0; i < HANDS.length; i++) {
      if (HANDS[i].test(res)) { hand = HANDS[i]; break; }
    }
    var line = res.join("");
    if (hand) {
      score += hand.pts;
      streak++;
      telop(hand.name + " " + hand.pts.toLocaleString("ja-JP"), line + " — " + hand.quip,
        hand.top ? "jackpot" : "");
      fanfare([523, 659, 784, 1047, 1319], 80);
    } else {
      score -= PENALTY;
      streak = 0;
      telop("ハズレ", line + " — " + MISS[Math.floor(Math.random() * MISS.length)], "miss");
      beep(120, 0.22, "sawtooth", 0.05);
    }
    if (score > best) {
      best = score;
      try { localStorage.setItem("chibikama-best", String(best)); } catch (e) { /* 保存できなくても続行 */ }
    }
    render();
    addLog(line, hand);
    spinning = false;
    leverEl.disabled = false;
  }

  function addLog(line, hand) {
    var empty = logEl.querySelector(".empty");
    if (empty) empty.remove();
    var li = document.createElement("li");
    if (!hand) li.className = "zero";
    var b = document.createElement("b");
    b.textContent = line;
    var sp = document.createElement("span");
    sp.textContent = hand ? hand.name : "—";
    var p = document.createElement("span");
    p.className = "p";
    p.textContent = hand ? "+" + hand.pts.toLocaleString("ja-JP") : "-" + PENALTY;
    li.appendChild(b); li.appendChild(sp); li.appendChild(p);
    logEl.insertBefore(li, logEl.firstChild);
    while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
  }

  // ---- 操作 ----
  leverEl.addEventListener("click", spin);

  document.getElementById("auto").addEventListener("click", function () {
    if (!spinning) spin();
    clearAuto();
    reels.forEach(function (r, i) {
      autoTimers.push(setTimeout(function () { stopReel(i); }, 300 + i * 260));
    });
  });

  var muteEl = document.getElementById("mute");
  muteEl.addEventListener("click", function () {
    muted = !muted;
    muteEl.textContent = muted ? "音 OFF" : "音 ON";
  });

  document.addEventListener("keydown", function (e) {
    if (e.key >= "1" && e.key <= "4") {
      stopReel(parseInt(e.key, 10) - 1);
      e.preventDefault();
      return;
    }
    if (e.code === "Space" || e.key === "Enter") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
      e.preventDefault();
      if (!spinning) { spin(); return; }
      for (var i = 0; i < reels.length; i++) {
        if (reels[i].spinning) { stopReel(i); return; }
      }
    }
  });

  // ---- 配当表 ----
  // 並びを総当たりして、確率と1回あたりの期待値を実測する。
  function analyze() {
    var s = reels.map(function (r) { return r.syms; });
    var total = 0, gain = 0;
    var hits = HANDS.map(function () { return 0; });
    for (var a = 0; a < s[0].length; a++)
      for (var b = 0; b < s[1].length; b++)
        for (var c = 0; c < s[2].length; c++)
          for (var d = 0; d < s[3].length; d++) {
            total++;
            var row = [s[0][a], s[1][b], s[2][c], s[3][d]], won = false;
            for (var i = 0; i < HANDS.length; i++) {
              if (HANDS[i].test(row)) { hits[i]++; gain += HANDS[i].pts; won = true; break; }
            }
            if (!won) gain -= PENALTY;
          }
    return { total: total, hits: hits, ev: gain / total };
  }

  var odds = analyze();
  var tbl = document.getElementById("paytable");
  HANDS.forEach(function (h, i) {
    var tr = document.createElement("tr");
    if (h.top) tr.className = "top";
    tr.innerHTML = "<td class=\"pat\">" + h.pat + "</td>" +
      "<td class=\"nm\">" + h.name + "</td>" +
      "<td class=\"od\">" + odds.hits[i] + "/" + odds.total + "</td>" +
      "<td class=\"pt\">" + h.pts.toLocaleString("ja-JP") + "</td>";
    tbl.appendChild(tr);
  });
  var missCount = odds.total - odds.hits.reduce(function (a, b) { return a + b; }, 0);
  var miss = document.createElement("tr");
  miss.innerHTML = "<td class=\"pat\">上記以外</td><td class=\"nm\">ハズレ</td>" +
    "<td class=\"od\">" + missCount + "/" + odds.total + "</td>" +
    "<td class=\"pt\">-" + PENALTY + "</td>";
  tbl.appendChild(miss);
  document.getElementById("ev").textContent =
    "1回まわすと平均 " + odds.ev.toFixed(1) + "点。回すほど沈む。";

  reels.forEach(draw);
  render();
})();
</script>
